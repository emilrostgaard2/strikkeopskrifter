name: Byg og upload til Simply
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent feeds, byg priser og sider
        env:
          FEED_RITO: ${{ secrets.FEED_RITO }}
          FEED_BROENGARN: ${{ secrets.FEED_BROENGARN }}
          FEED_KREATIVGARN: ${{ secrets.FEED_KREATIVGARN }}
        run: |
          python3 _build/feeds.py
          python3 _build/pages.py

      - name: Test SSH-forbindelse
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass rsync
          echo "Host: '${SSH_HOST}'  Bruger: '${SSH_USER}'  Kode sat: $([ -n "$SSH_PASSWORD" ] && echo ja || echo NEJ)"
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'echo "SSH OK"; which rsync || echo "rsync mangler på serveren"; ls -d public_html' 2>&1 | tail -25

      - name: Upload med rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -az --delete --stats \
            --exclude '.git/' --exclude '.github/' --exclude '_build/' \
            --exclude 'feeds/' --exclude '*.md' --exclude '.gitignore' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:public_html/"
