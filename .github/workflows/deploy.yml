name: Upload til Simply
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"   # hver nat kl. 05:15 dansk tid – henter feeds og deployer nye priser
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent feeds og byg priser
        env:
          FEED_RITO: ${{ secrets.FEED_RITO }}
          FEED_BROENGARN: ${{ secrets.FEED_BROENGARN }}
          FEED_KREATIVGARN: ${{ secrets.FEED_KREATIVGARN }}
        run: python3 _build/feeds.py

      - name: Upload med lftp
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BRUGER: ${{ secrets.FTP_USERNAME }}
          KODE: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 6;
            set net:timeout 120;
            set net:reconnect-interval-base 20;
            set net:reconnect-interval-multiplier 1.5;
            set mirror:parallel-directories false;
            set mirror:parallel-transfer-count 1;
            open -u '$BRUGER','$KODE' '$SERVER';
            mirror --reverse --only-newer --continue --verbose=1 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob _build/ \
              --exclude-glob feeds/ \
              --exclude-glob '*.md' \
              ./ public_html/;
          "
