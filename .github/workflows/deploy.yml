name: Byg og upload til Simply
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"   # hver nat ca. kl. 05:15 dansk tid
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent feeds, byg priser og sider
        env:
          FEED_RITO: ${{ secrets.FEED_RITO }}
          FEED_BROENGARN: ${{ secrets.FEED_BROENGARN }}
          FEED_KREATIVGARN: ${{ secrets.FEED_KREATIVGARN }}
        run: |
          pip install -q pillow
          python3 _build/feeds.py
          python3 _build/drops.py --max 150 || echo "drops.py fejlede – fortsætter"
          python3 _build/images.py --max 400 || echo "images.py fejlede – fortsætter"
          python3 _build/pages.py

      - name: Gem cache (drops-details, prishistorik, billeder) tilbage i repoet
        run: |
          git config user.name "strikkebot" && git config user.email "bot@strikkeopskrifter.dk"
          git add data/drops-details.json data/prishistorik.json data/lastmod.json assets/img/cache 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "data: natlig opdatering" && git push)

      - name: Upload med lftp (parallelt)
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BRUGER: ${{ secrets.FTP_USERNAME }}
          KODE: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 6;
            set net:timeout 120;
            set net:reconnect-interval-base 10;
            set net:reconnect-interval-multiplier 1.5;
            set mirror:parallel-directories true;
            set mirror:parallel-transfer-count 10;
            set mirror:use-pget-n 1;
            open -u '$BRUGER','$KODE' '$SERVER';
            mirror --reverse --only-newer --continue --delete --verbose=1 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob _build/ \
              --exclude-glob feeds/ \
              --exclude-glob '*.md' \
              --exclude-glob .gitignore \
              ./ public_html/;
          "
