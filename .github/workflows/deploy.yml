name: Byg og upload til Simply
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"   # hver nat ca. kl. 05:15 dansk tid
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent feeds, byg priser og sider
        env:
          FEED_RITO: ${{ secrets.FEED_RITO }}
          FEED_BROENGARN: ${{ secrets.FEED_BROENGARN }}
          FEED_KREATIVGARN: ${{ secrets.FEED_KREATIVGARN }}
        run: |
          python3 _build/feeds.py
          python3 _build/pages.py

      - name: Upload med rsync over SSH (adgangskode)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -az --delete --stats \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_build/' \
            --exclude 'feeds/' \
            --exclude '*.md' \
            --exclude '.gitignore' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:public_html/"
